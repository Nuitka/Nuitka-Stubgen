name: CI Tests & Compatibility

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit-tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Type check
        run: uv run ty check .

      - name: Test
        run: uv run pytest tests/ -v

      - name: Build package
        run: uv build

  compat-generate-and-e2e:
    name: Generate Stub & E2E Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Generate vendored stubgen
        run: uv run python -m nuitka_stubgen.vendor -o vendored_output/stubgen

      - name: Verify AST-level 3.5 syntax compatibility
        run: uv run pytest tests/test_vendor.py::TestVendorTransform -v

      - name: Upload vendored stub artifact
        uses: actions/upload-artifact@v7
        with:
          name: vendored-stub
          path: vendored_output/

      - name: Checkout Nuitka
        uses: actions/checkout@v4
        with:
          repository: Nuitka/Nuitka
          ref: main
          path: Nuitka

      - name: Replace Nuitka's stubgen with our vendored stubgen
        run: |
          rm -rf Nuitka/nuitka/build/inline_copy/stubgen/*
          cp -r vendored_output/stubgen/* Nuitka/nuitka/build/inline_copy/stubgen/

      - name: Install Nuitka in current virtualenv
        run: uv pip install ./Nuitka

      - name: Run E2E Integration Test (Compile Module & Verify Stubgen)
        run: |
          echo "def add(x: int, y: int) -> int: return x + y" > test_module.py
          uv run python -m nuitka --mode=module test_module.py
          if [ ! -f test_module.pyi ]; then
            echo "Error: test_module.pyi was not generated!"
            exit 1
          fi
          cat test_module.pyi
          if ! grep -q "def add" test_module.pyi; then
            echo "Error: Generated stub does not contain 'def add'!"
            exit 1
          fi

      - name: Run Nuitka basic tests
        run: |
          cd Nuitka
          uv run python ./tests/run-tests --no-other-python --skip-reflection-test --skip-all-cpython-tests --skip-standalone-tests --skip-onefile-tests --skip-optimizations-tests --assume-yes-for-downloads

  compat-verify-py35:
    name: Run under CPython 3.5
    runs-on: ubuntu-latest
    needs: compat-generate-and-e2e
    container: python:3.5-slim

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vendored-stub
          path: vendored_output/

      - name: Run functional tests
        run: >
          python tests/run_vendor_py35.py
          vendored_output/stubgen
          tests/fixtures/cases/legacy
