[project]
name = "nuitka-stubgen"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["libcst>=1.8.6"]

[project.urls]
Homepage = "https://github.com/Nuitka/Nuitka-Stubgen"
Repository = "https://github.com/Nuitka/Nuitka-Stubgen"
Issues = "https://github.com/Nuitka/Nuitka-Stubgen/issues"

[project.scripts]
nuitka-stubgen = "nuitka_stubgen.cli:main"
nuitka-stubgen-vendor = "nuitka_stubgen.vendor:main"

[build-system]
requires = ["uv_build>=0.7.2,<0.8"]
build-backend = "uv_build"